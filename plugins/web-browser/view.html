<template data-slot="views">
  <!-- Web browser: one tab per site (byPath, the path is the address). The
       page bar holds the address and the actions; below, one frame per open
       site, kept while its tab lives so that a page keeps its state. Icons are
       filled in by browser.js from data-wb-icon. -->
  <div class="wb-view hidden" id="wb-view">
    <header class="page-bar wb-head">
      <span class="page-bar-icon" data-page-icon="web-browser" aria-hidden="true"></span>
      <form class="wb-address" id="wb-address-form" autocomplete="off">
        <span class="wb-lock" id="wb-lock" aria-hidden="true"></span>
        <input type="text" id="wb-address" spellcheck="false" inputmode="url" data-i18n-placeholder="plugin.web-browser.address.placeholder" data-i18n-aria-label="plugin.web-browser.address.label" />
      </form>
      <div class="page-bar-actions">
        <button type="button" id="wb-reload" data-wb-icon="arrow-clockwise" data-i18n-title="plugin.web-browser.reload" data-i18n-aria-label="plugin.web-browser.reload"></button>
        <button type="button" id="wb-copy" data-wb-icon="link" data-i18n-title="plugin.web-browser.copy" data-i18n-aria-label="plugin.web-browser.copy"></button>
        <button type="button" id="wb-external" data-wb-icon="arrow-square-out" data-wb-label="plugin.web-browser.external" data-i18n-title="plugin.web-browser.externalTitle"></button>
      </div>
    </header>
    <!-- The frames, from edge to edge. -->
    <div class="wb-stage" id="wb-stage">
      <div class="wb-notice hidden" id="wb-notice" role="status">
        <span class="wb-notice-icon" data-wb-icon="warning"></span>
        <p class="wb-notice-title" id="wb-notice-title"></p>
        <p class="wb-notice-text" id="wb-notice-text"></p>
        <div class="wb-notice-actions">
          <button type="button" class="wb-notice-main" id="wb-notice-open" data-wb-icon="arrow-square-out" data-wb-label="plugin.web-browser.external"></button>
          <button type="button" id="wb-notice-force" data-wb-label="plugin.web-browser.blocked.force"></button>
        </div>
      </div>
    </div>
  </div>
</template>
